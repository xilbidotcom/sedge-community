name: Bug report
description: Report a reproducible Community edition problem.
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities or private data here. Follow SECURITY.md for private reports.
  - type: input
    id: version
    attributes:
      label: Community version and environment
      description: Include OS, Python and Node versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and minimal configuration
      description: Include only synthetic configuration, never private datasets or credentials.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
